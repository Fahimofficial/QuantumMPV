version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    # Version updates wait a week after a release so broken or malicious
    # versions are more likely to be caught upstream first. Security updates
    # are not delayed by cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Libraries that must move together are grouped so CI tests them as one
    # change. Everything else still gets an individual PR.
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"
      androidx-compose:
        patterns:
          - "androidx.compose*"
        update-types:
          - minor
          - patch
      media3:
        patterns:
          - "androidx.media3:*"
      test-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # These libraries are pinned on purpose by the root build.gradle.kts
    # `resolutionStrategy.eachDependency` security block (and mirrored as
    # `constraints` in app/build.gradle.kts). Dependabot's Gradle parser
    # cannot model forced/constraint versions for buildscript + plugin-classpath
    # coordinates, so it fails the run with `dependency_not_found` instead of
    # simply skipping them. Ignore them here: the pins are maintained manually,
    # and this stops the updater from erroring out on the whole ecosystem.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
      - dependency-name: "org.apache.commons:commons-lang3"
      - dependency-name: "org.bitbucket.b_c:jose4j"
      - dependency-name: "org.bouncycastle:bcprov-jdk18on"
      - dependency-name: "org.bouncycastle:bcpkix-jdk18on"
      - dependency-name: "org.jdom:jdom2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    # Actions are SHA-pinned; one grouped PR per week keeps pins current
    # without a PR per action.
    groups:
      github-actions:
        patterns:
          - "*"

  # Hash-pinned Python tooling used by workflow-audit.yml.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      ci-python:
        patterns:
          - "*"

  # npm dependencies for the documentation/preview website (website/).
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - website
    cooldown:
      default-days: 7
    # Keep PR volume low: group dev deps and non-major runtime bumps.
    groups:
      website-dev:
        dependency-type: development
      website-prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
