name: Dependency review

# Compares the dependency graph of the pull request head with its base and
# blocks newly introduced dependencies that have known vulnerabilities.
# Gradle dependencies appear in the graph through dependency submission
# (dependency-submission.yml on master, automatic submission on PR branches).

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Block vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # High and critical advisories block the merge. Moderate and low
          # advisories are listed in the job summary for triage.
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-patched-versions: true
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

      # Advisory only: Gradle POMs often lack machine-readable license data, so a
      # blocking allow-list would produce false failures. Review any license this
      # step reports before merging; QuantumMPV is distributed under AGPL-3.0.
      - name: Report licenses outside the AGPL-compatible allow-list
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: false
          license-check: true
          warn-only: true
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, BSL-1.0,
            Unlicense, CC0-1.0, MPL-2.0, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, Python-2.0, Unicode-DFS-2016, Unicode-3.0
