name: Make release

# Stable release pipeline. Stages run in separate jobs so that the stable
# signing step never shares a runner with Gradle or other third-party build
# code. (Preview builds use the same key in preview.yml / pre-release.yml,
# which still sign inside the build job; see docs/RELEASE.md.)
#
#   resolve           validate the tag, its source and its required checks
#   instrumented      emulator tests on the exact tagged source (reusable)
#   build             unsigned release APKs, release-specific validation
#   sign              production signing in the `production` environment
#   publish           checksums, SBOM, provenance attestation, GitHub release
#
# See docs/RELEASE.md for the release procedure and required secrets.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'
  # Run manually from the tag itself ("Use workflow from" -> Tags -> vX.Y.Z),
  # so the production environment's tag deployment policy applies.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional; must equal the selected tag (for example v1.2.0)
        required: false
        type: string

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
    -Dkotlin.daemon.jvm.options=-Xmx4g
  BUILD_TOOLS: 37.0.0
  # Expected number of published APKs: standard universal + 4 ABIs, FongMi, non-Vulkan.
  EXPECTED_APK_COUNT: 7

permissions: {}

concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and tagged source
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Run this workflow on the release tag (Use workflow from -> Tags), not on ${GITHUB_REF}."
            exit 1
          fi
          tag_name="${GITHUB_REF#refs/tags/}"
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != "$tag_name" ]]; then
            echo "::error::Input tag_name '${INPUT_TAG}' does not match the selected tag '${tag_name}'."
            exit 1
          fi

          if [[ ! "$tag_name" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable release tag '${tag_name}'. Expected v1.MINOR.PATCH (QuantumMPV uses the v1.x line; preview tags use pre-release.yml)."
            exit 1
          fi

          # fetch-depth: 0 already fetched every tag and origin/* branch.
          tag_sha="$(git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}" || true)"
          if [[ -z "$tag_sha" ]]; then
            echo "::error::Tag ${tag_name} does not exist on origin or does not point to a commit."
            exit 1
          fi

          # Releases may only be cut from commits that are part of master, i.e.
          # that went through pull request review and branch protection.
          if ! git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/master; then
            echo "::error::Tag ${tag_name} (${tag_sha}) is not on master. Release only from merged commits."
            exit 1
          fi

          version="${tag_name#v}"
          build_version="$(git show "${tag_sha}:app/build.gradle.kts" | sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ "$build_version" != "$version" ]]; then
            echo "::error::versionName at ${tag_name} is '${build_version}', expected '${version}'. Bump it in a PR with tools/prepare_release.py first."
            exit 1
          fi

          first_heading="$(git show "${tag_sha}:CHANGELOG.md" | grep -m1 '^## ' || true)"
          if [[ "$first_heading" != "## ${version}" ]]; then
            echo "::error::The first CHANGELOG.md section at ${tag_name} must be '## ${version}', found '${first_heading}'."
            exit 1
          fi

          {
            echo "tag=$tag_name"
            echo "sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${tag_name} -> ${tag_sha}"

      # The same checks that branch protection requires for merging, plus the
      # security gates. They ran on master for this commit; a missing,
      # failed or cancelled check blocks the release.
      - name: Verify required checks passed on the tagged commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: >-
          python3 tools/verify_commit_checks.py --sha "$TAG_SHA"
          --check "Lint, test, and build debug APK"
          --check "ktlint + detekt"
          --check "Detect leaked secrets"
          --check "Analyze (java-kotlin)"
          --check "Android security policy"

  instrumented:
    name: Instrumented tests
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/instrumented-tests.yml

  build:
    name: Build unsigned release APKs
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      VERSION_TAG: ${{ needs.resolve.outputs.tag }}
      EXPECTED_VERSION_NAME: ${{ needs.resolve.outputs.version }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # This workflow only runs on tag refs (checked in resolve), so the default
      # checkout is the tagged commit; the next step proves it.
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: versionCode and BuildConfig use the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout state
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Checkout SHA ${current_sha} does not match tag SHA ${TARGET_SHA}."
            exit 1
          fi

      - name: Fetch and verify pinned native artifacts
        run: python3 tools/verify_native_artifacts.py --download

      # No Gradle cache: release builds must not restore state that another
      # workflow wrote (cache poisoning). Releases are rare, so the extra
      # download time is acceptable.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;${BUILD_TOOLS}" "cmake;3.22.1" "ndk;27.3.13750724"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=1
          ./gradlew assembleFongmiRelease --stacktrace --no-daemon --max-workers=1
          ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=1

      - name: Stage and validate unsigned APKs
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"
          release_code="$(sed -n 's/^val releaseVersionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)"
          [[ "$release_code" =~ ^[0-9]+$ ]] || { echo "::error::Could not read releaseVersionCode"; exit 1; }
          stable_code=$(( release_code * 10000 + 9999 ))
          mkdir -p unsigned

          stage() {
            local source="$1" public_name="$2" abi_code="$3"
            if [[ ! -f "$source" ]]; then
              echo "::error::Missing expected APK ${source}"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi
            local badging package_line version_code version_name
            badging="$("$aapt" dump badging "$source")"
            package_line="$(sed -n '1p' <<< "$badging")"
            grep -q "package: name='com.quantummpv.app'" <<< "$package_line" || {
              echo "::error::Unexpected application ID in ${source}: ${package_line}"; exit 1; }
            version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
            version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
            [[ "$version_name" == "$EXPECTED_VERSION_NAME" ]] || {
              echo "::error::${source} has versionName ${version_name}, expected ${EXPECTED_VERSION_NAME}"; exit 1; }
            [[ "$version_code" == "$(( stable_code * 10 + abi_code ))" ]] || {
              echo "::error::${source} has versionCode ${version_code}, expected $(( stable_code * 10 + abi_code ))"; exit 1; }
            if grep -q '^application-debuggable' <<< "$badging"; then
              echo "::error::${source} is debuggable; refusing to release it."
              exit 1
            fi
            cp "$source" "unsigned/QuantumMPV-${public_name}-${VERSION_TAG}.apk"
            echo "OK ${public_name}: versionCode ${version_code}, versionName ${version_name}, not debuggable"
          }

          release_dir="app/build/outputs/apk/standard/release"
          stage "$release_dir/app-standard-universal-release-unsigned.apk" universal 0
          stage "$release_dir/app-standard-armeabi-v7a-release-unsigned.apk" armeabi-v7a 1
          stage "$release_dir/app-standard-arm64-v8a-release-unsigned.apk" arm64-v8a 2
          stage "$release_dir/app-standard-x86-release-unsigned.apk" x86 3
          stage "$release_dir/app-standard-x86_64-release-unsigned.apk" x86_64 4
          stage "app/build/outputs/apk/fongmi/release/app-fongmi-universal-release-unsigned.apk" fongmi 0
          stage "app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release-unsigned.apk" no-vulkan 0

          count="$(find unsigned -maxdepth 1 -name '*.apk' | wc -l)"
          [[ "$count" -eq "$EXPECTED_APK_COUNT" ]] || { echo "::error::Staged ${count} APKs, expected ${EXPECTED_APK_COUNT}"; exit 1; }

      - name: Verify native contents of release APKs
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            python3 tools/verify_native_artifacts.py --apk "$apk"
          done < <(find unsigned -type f -name '*.apk' -print0)

      - name: Upload unsigned APKs for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-apks
          path: unsigned/*.apk
          if-no-files-found: error
          # Short-lived, but long enough to re-run a failed later job.
          retention-days: 5
          compression-level: 0

  sign:
    name: Sign release APKs
    needs: [resolve, build, instrumented]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Holds the production signing secrets. Configure required reviewers and a
    # deployment policy allowing only tags v1.*.* (docs/RELEASE.md).
    environment: production
    permissions: {}
    env:
      VERSION_TAG: ${{ needs.resolve.outputs.tag }}
      EXPECTED_VERSION_NAME: ${{ needs.resolve.outputs.version }}
      # Public SHA-256 fingerprint of the release signing certificate. Not a
      # secret. When set, every signed APK must match it.
      EXPECTED_CERT_SHA256: ${{ vars.RELEASE_SIGNING_CERT_SHA256 }}
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true

      - name: Install apksigner
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;${BUILD_TOOLS}"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

      - name: Download unsigned APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-apks
          path: unsigned

      - name: Sign and verify APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEY_ALIAS" || -z "$KS_PASS" || -z "$KEY_PASS" ]]; then
            echo "::error::Stable releases require SIGNING_KEYSTORE, SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD and KEY_PASSWORD. Nothing was published."
            exit 1
          fi

          umask 077
          keystore="$(mktemp "${RUNNER_TEMP}/quantummpv-keystore.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$keystore"

          # apksigner prints lowercase hex without separators; keytool and the
          # Play Console show uppercase, colon-separated hex. Normalize both
          # sides so the comparison does not depend on either format.
          normalize_fingerprint() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }

          mkdir -p signed
          fingerprints=""
          for unsigned in unsigned/*.apk; do
            name="$(basename "$unsigned")"
            "$tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out "signed/$name" \
              "$unsigned"
            "$tools/apksigner" verify --verbose "signed/$name" >/dev/null
            cert="$("$tools/apksigner" verify --print-certs "signed/$name" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | normalize_fingerprint)"
            [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Could not read the SHA-256 signing certificate digest of $name"; exit 1; }
            fingerprints="$fingerprints $cert"
            package_line="$("$tools/aapt" dump badging "signed/$name" | sed -n '1p')"
            grep -q "package: name='com.quantummpv.app'" <<< "$package_line" || { echo "::error::Unexpected package in $name"; exit 1; }
            grep -q "versionName='${EXPECTED_VERSION_NAME}'" <<< "$package_line" || { echo "::error::Unexpected versionName in $name"; exit 1; }
            echo "Signed and verified $name"
          done

          unique="$(tr ' ' '\n' <<< "$fingerprints" | sed '/^$/d' | sort -u)"
          if [[ "$(wc -l <<< "$unique")" -ne 1 ]]; then
            echo "::error::APKs were signed with different certificates."
            exit 1
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" ]]; then
            expected="$(normalize_fingerprint <<< "$EXPECTED_CERT_SHA256")"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::RELEASE_SIGNING_CERT_SHA256 must be a SHA-256 digest (64 hex digits, colons optional). Nothing was published."
              exit 1
            fi
            if [[ "$unique" != "$expected" ]]; then
              echo "::error::Signing certificate ${unique} does not match RELEASE_SIGNING_CERT_SHA256. Existing users could not update; nothing was published."
              exit 1
            fi
            echo "Signing certificate matches RELEASE_SIGNING_CERT_SHA256."
          else
            echo "::warning::Repository variable RELEASE_SIGNING_CERT_SHA256 is not set, so the signing certificate was not compared with the expected key. Certificate SHA-256: ${unique}"
          fi

          count="$(find signed -maxdepth 1 -name '*.apk' | wc -l)"
          [[ "$count" -eq "$EXPECTED_APK_COUNT" ]] || { echo "::error::Signed ${count} APKs, expected ${EXPECTED_APK_COUNT}"; exit 1; }

      - name: Upload signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-apks
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [resolve, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout state
        shell: bash
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "::error::Checkout does not match tag SHA ${TARGET_SHA}."
            exit 1
          fi

      - name: Download signed APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-apks
          path: release-assets

      # Re-checks the APKs after the artifact round trip and signing. The pinned
      # AARs are needed as the reference, so they are fetched (and their
      # checksums verified) first.
      - name: Verify native contents of signed APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_native_artifacts.py --download
          count=0
          while IFS= read -r -d '' apk; do
            python3 tools/verify_native_artifacts.py --apk "$apk"
            count=$((count + 1))
          done < <(find release-assets -type f -name '*.apk' -print0)
          [[ "$count" -eq "$EXPECTED_APK_COUNT" ]] || { echo "::error::Found ${count} signed APKs, expected ${EXPECTED_APK_COUNT}"; exit 1; }

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -- *.apk) > checksums.txt
          cp checksums.txt "release-assets/QuantumMPV-${VERSION_TAG}-SHA256SUMS.txt"
          cat checksums.txt

      # The dependency graph SBOM is generated by GitHub from the submitted
      # Gradle graph of the default branch (dependency-submission.yml). Release
      # tags are cut from master, so it describes the released dependencies as
      # of publication time.
      - name: Export SBOM from the dependency graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' \
            > "release-assets/QuantumMPV-${VERSION_TAG}-sbom.spdx.json"
          python3 -m json.tool "release-assets/QuantumMPV-${VERSION_TAG}-sbom.spdx.json" >/dev/null

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.apk

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          section = []
          in_latest = False
          for line in changelog:
              if line.startswith('## '):
                  if in_latest:
                      break
                  in_latest = True
              if in_latest:
                  section.append(line)

          latest = '\n'.join(section).strip()
          expected_heading = f"## {os.environ['VERSION_TAG'][1:]}"
          if not latest or section[0] != expected_heading:
              raise SystemExit(f'Latest CHANGELOG.md section must start with {expected_heading!r}')
          variant_guide = """
          ### APK variants

          All variants contain the same QuantumMPV app version and features, with bundled native mpv backends. See [CITATION.md](https://github.com/Fahimofficial/QuantumMPV/blob/master/CITATION.md) for upstream and library credits. Choose the package that best matches your device:

          - **Standard** (`QuantumMPV-<architecture>-<version>.apk`): Recommended for most devices. Available as Universal and architecture-specific APKs with the standard Vulkan-capable playback backend.
          - **FongMi** (`QuantumMPV-fongmi-<version>.apk`): Universal package using the FongMi native profile for Vulkan, direct MediaCodec, and Dolby Vision playback.
          - **Non-Vulkan** (`QuantumMPV-no-vulkan-<version>.apk`): Universal OpenGL-only package for devices without compatible Vulkan support or with unstable legacy GPU drivers.

          ### Verifying downloads

          Each APK has a build provenance attestation. Verify with `gh attestation verify <apk> --repo Fahimofficial/QuantumMPV`, and compare the SHA-256 below. The SPDX SBOM is attached as `QuantumMPV-<version>-sbom.spdx.json`.
          """.strip()
          Path('release-notes.md').write_text(
              latest + '\n\n---\n' + variant_guide + '\n\n### SHA-256 checksums\n\n```text\n',
              encoding='utf-8',
          )
          PY
          cat checksums.txt >> release-notes.md
          printf '%s\n' '```' >> release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: QuantumMPV ${{ env.VERSION_TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*-SHA256SUMS.txt
            release-assets/*-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
