name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1

jobs:
  ktlint-detekt:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Both steps keep going so a single run always reports ktlint *and* detekt findings
      # instead of stopping at the first tool that has anything to say.
      - name: ktlint
        id: ktlint
        run: |
          set +e
          ./gradlew :app:ktlintCheck ktlintKotlinScriptCheck --stacktrace --no-daemon --max-workers=1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo "::warning::ktlint reported formatting findings (exit code $status); detekt remains the blocking quality gate."
          fi
          exit 0

      - name: Download detekt CLI
        if: ${{ always() }}
        run: curl -fsSL -o /tmp/detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: detekt
        id: detekt
        if: ${{ always() }}
        run: |
          mkdir -p app/build/reports/detekt
          java -jar /tmp/detekt-cli.jar --input app/src --config config/detekt/detekt.yml --report txt:app/build/reports/detekt/detekt.txt

      - name: Summarise findings
        if: ${{ always() }}
        run: |
          echo "ktlint: ${{ steps.ktlint.outcome }} (exit code ${{ steps.ktlint.outputs.exit_code || '0' }})"
          echo "detekt: ${{ steps.detekt.outcome }}"
          if [ -f app/build/reports/detekt/detekt.txt ]; then
            echo "detekt findings: $(grep -c '^[^ ]' app/build/reports/detekt/detekt.txt || true)"
          fi

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports-${{ github.sha }}
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7
