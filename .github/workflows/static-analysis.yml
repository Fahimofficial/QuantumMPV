name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1

jobs:
  ktlint-detekt:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking while the baseline is being tuned; remove this line once the
    # job is green on master to make it a required quality gate.
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: ktlint
        run: ./gradlew :app:ktlintCheck ktlintKotlinScriptCheck --stacktrace --no-daemon --max-workers=1

      - name: Download detekt CLI
        run: curl -fsSL -o /tmp/detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar

      - name: detekt
        run: |
          mkdir -p app/build/reports/detekt
          java -jar /tmp/detekt-cli.jar --input app/src --config config/detekt/detekt.yml --report txt:app/build/reports/detekt/detekt.txt

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports-${{ github.sha }}
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7
