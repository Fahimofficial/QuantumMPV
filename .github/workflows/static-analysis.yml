name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1

jobs:
  ktlint-detekt:
    name: ktlint + detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Both steps keep going so a single run always reports ktlint *and* detekt findings
      # instead of stopping at the first tool that has anything to say.
      - name: ktlint
        id: ktlint
        continue-on-error: true
        run: ./gradlew :app:ktlintCheck ktlintKotlinScriptCheck --stacktrace --no-daemon --max-workers=1

      - name: Download and verify detekt CLI
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar"
          expected="2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/detekt-cli.jar "$url"
          actual="$(sha256sum /tmp/detekt-cli.jar | cut -d' ' -f1)"
          [[ "$actual" == "$expected" ]] || { echo "Detekt checksum mismatch: $actual" >&2; exit 1; }

      - name: detekt
        id: detekt
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p app/build/reports/detekt
          java -jar /tmp/detekt-cli.jar --input app/src --config config/detekt/detekt.yml --report txt:app/build/reports/detekt/detekt.txt

      - name: Summarise findings
        if: ${{ always() }}
        run: |
          echo "ktlint: ${{ steps.ktlint.outcome }}"
          echo "detekt: ${{ steps.detekt.outcome }}"
          if [ -f app/build/reports/detekt/detekt.txt ]; then
            echo "detekt findings: $(grep -c '^[^ ]' app/build/reports/detekt/detekt.txt || true)"
          fi

      # Quality gate: the two tools above always both run (see continue-on-error),
      # but neither finding is ever swallowed. Any genuine ktlint or detekt
      # violation fails this job, so the gate stays blocking as documented.
      - name: Enforce static analysis gate
        if: ${{ always() }}
        run: |
          echo "ktlint outcome: ${{ steps.ktlint.outcome }}"
          echo "detekt outcome: ${{ steps.detekt.outcome }}"
          failed=0
          if [ "${{ steps.ktlint.outcome }}" != "success" ]; then
            echo "::error::ktlint reported violations (see the ktlint step log and the uploaded report)."
            failed=1
          fi
          if [ "${{ steps.detekt.outcome }}" != "success" ]; then
            echo "::error::detekt reported findings (see the detekt step log and the uploaded report)."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Static analysis gate failed."
            exit 1
          fi
          echo "Static analysis gate passed."

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-analysis-reports-${{ github.sha }}
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7
