name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, for example 2.5.1
        required: true
        type: string
      prerelease:
        description: Create a preview tag instead of a stable tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Bump version and create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update app version
        run: python3 tools/prepare_release.py "${{ inputs.version }}"

      - name: Commit version bump and create tag
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            TAG="v${VERSION}-preview.1"
          else
            TAG="v${VERSION}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --cached --quiet && { echo "No version change to commit"; exit 1; }
          git commit -m "release: prepare ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin master
          git push origin "${TAG}"
          echo "Created ${TAG}; the release workflow will now build and publish it."
