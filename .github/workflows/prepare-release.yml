name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: QuantumMPV version, for example 1.1.0 (do not use upstream mpvRx versions)
        required: true
        type: string
      prerelease:
        description: Create a preview tag instead of a stable tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Bump version and create release tag
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Update app version
        run: python3 tools/prepare_release.py "${{ inputs.version }}"

      - name: Commit version bump and create tag
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # 1. Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION. Expected X.Y.Z"
            exit 1
          fi

          # Fetch tags and read the current remote state. Keep matching as
          # exact ref-string matching so the requested version cannot be
          # interpreted as a regular expression.
          git fetch origin --tags --quiet
          REMOTE_TAGS="$(git ls-remote --tags origin)"
          if [[ "$PRERELEASE" == "true" ]]; then
            LATEST_PREVIEW="$(printf '%s\n' "$REMOTE_TAGS" | awk \
              -v prefix="refs/tags/v${VERSION}-preview." '
                index($2, prefix) == 1 {
                  suffix = substr($2, length(prefix) + 1)
                  if (suffix ~ /^[0-9]+$/) {
                    number = suffix + 0
                    if (!found || number > highest) highest = number
                    found = 1
                  }
                }
                END { if (found) printf "%.0f\n", highest }
              ')"

            if [[ -z "$LATEST_PREVIEW" ]]; then
              NEXT_NUM=1
            else
              NEXT_NUM=$((LATEST_PREVIEW + 1))
            fi
            TAG="v${VERSION}-preview.${NEXT_NUM}"
          else
            TAG="v${VERSION}"
          fi

          # 3. Refuse an existing stable/preview tag. The query itself is
          # checked under set -e, so network failures cannot be mistaken for
          # an unused tag.
          if printf '%s\n' "$REMOTE_TAGS" | awk -v tag="refs/tags/${TAG}" '$2 == tag { found = 1 } END { exit !found }'; then
            echo "Tag ${TAG} already exists on remote; refusing to overwrite it."
            exit 1
          fi

          git fetch origin master --quiet
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo 'master changed after checkout; refusing to create a release from a stale branch.'
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git diff --cached --quiet && { echo "No version change to commit"; exit 1; }
          git commit -m "release: prepare ${TAG}"

          # Refresh and check immediately before pushing to catch a competing
          # run. The final atomic push also fails without changing either ref
          # if another run wins the race after this check.
          REMOTE_TAGS="$(git ls-remote --tags origin)"
          if printf '%s\n' "$REMOTE_TAGS" | awk -v tag="refs/tags/${TAG}" '$2 == tag { found = 1 } END { exit !found }'; then
            echo "Tag ${TAG} was created by someone else; failing safely."
            exit 1
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push --atomic origin master "refs/tags/${TAG}"
          echo "Created ${TAG}; the release workflow will now build and publish it."
