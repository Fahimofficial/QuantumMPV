name: Prepare Release

# Creates a release tag on the current master commit and starts the matching
# release workflow. It does not commit to master: master is protected and only
# changes through reviewed pull requests, so the version bump
# (tools/prepare_release.py) and the CHANGELOG entry land in a PR first.
# See docs/RELEASE.md.
#
# Tags created with GITHUB_TOKEN do not trigger push workflows, so this
# workflow dispatches release.yml / pre-release.yml explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: QuantumMPV version already set on master, for example 1.4.5 (do not use upstream mpvRx versions)
        required: true
        type: string
      prerelease:
        description: Create the next v<version>-preview.N tag instead of the stable tag
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Create release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      checks: read
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Expected 1.MINOR.PATCH (QuantumMPV uses the 1.x line)."
            exit 1
          fi

      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify master is prepared for this version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_release.py "$VERSION"
          if ! git diff --quiet -- app/build.gradle.kts; then
            echo "::error::master is not prepared for ${VERSION}. Open a PR that runs 'python3 tools/prepare_release.py ${VERSION}' (versionName and releaseVersionCode) and updates CHANGELOG.md, merge it, then rerun this workflow."
            git diff -- app/build.gradle.kts
            exit 1
          fi
          if [[ "$PRERELEASE" != "true" ]]; then
            first_heading="$(grep -m1 '^## ' CHANGELOG.md || true)"
            if [[ "$first_heading" != "## ${VERSION}" ]]; then
              echo "::error::The first CHANGELOG.md section must be '## ${VERSION}' for a stable release, found '${first_heading}'."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Choose tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          if [[ "$PRERELEASE" == "true" ]]; then
            latest="$(git tag --list "v${VERSION}-preview.*" | sed -n "s/^v${VERSION//./\\.}-preview\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)"
            tag="v${VERSION}-preview.$(( ${latest:-0} + 1 ))"
            workflow="pre-release.yml"
          else
            tag="v${VERSION}"
            workflow="release.yml"
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists; refusing to move it."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "Next tag: $tag"

      - name: Verify required checks passed on master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: >-
          python3 tools/verify_commit_checks.py --sha "$TARGET_SHA"
          --check "Lint, test, and build debug APK"
          --check "ktlint + detekt"
          --check "Detect leaked secrets"
          --check "Android security policy"

      # The ref is created through the API, so no Git credentials are written
      # to disk. Creating a ref fails if it already exists, which makes a
      # concurrent run fail safely instead of moving a tag.
      - name: Create annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="Release ${TAG}" -f object="$TARGET_SHA" -f type=commit --jq '.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$tag_object" >/dev/null
          echo "Created ${TAG} at ${TARGET_SHA}"

      - name: Start the release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          WORKFLOW: ${{ steps.tag.outputs.workflow }}
        run: |
          set -euo pipefail
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref master -f tag_name="$TAG"
          echo "Dispatched ${WORKFLOW} for ${TAG}." >> "$GITHUB_STEP_SUMMARY"
