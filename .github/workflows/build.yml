name: CI/CD Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: APK flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - all
          - dual
          - fongmi
          - no_vulkan

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SELECTED_FLAVOR: ${{ inputs.build_flavor || 'standard' }}

jobs:
  build:
    name: Build selected release APK flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            ./gradlew assembleFongmiRelease --stacktrace --no-daemon --max-workers=2
          fi
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=2
          fi

      - name: Verify expected unsigned flavor outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "standard" ]]; then
            release_dir="app/build/outputs/apk/standard/release"
            architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
            for abi in "${architectures[@]}"; do
              if ! compgen -G "$release_dir/app-standard-${abi}-release-unsigned.apk" >/dev/null; then
                echo "No standard unsigned release APK found for $abi"
                find "$release_dir" -maxdepth 1 -type f -name '*.apk' -print || true
                exit 1
              fi
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "fongmi" ]]; then
            flavor="fongmi"
            flavor_dir="app/build/outputs/apk/fongmi/release"
            if [[ ! -f "$flavor_dir/app-${flavor}-universal-release-unsigned.apk" ]]; then
              echo "No universal unsigned release APK found for $flavor"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print || true
              exit 1
            fi
          fi

          if [[ "$SELECTED_FLAVOR" == "all" || "$SELECTED_FLAVOR" == "no_vulkan" ]]; then
            flavor="noVulkan"
            flavor_dir="app/build/outputs/apk/noVulkan/release"
            if [[ ! -f "$flavor_dir/app-${flavor}-universal-release-unsigned.apk" ]]; then
              echo "No universal unsigned non-Vulkan release APK found"
              find "$flavor_dir" -maxdepth 1 -type f -name '*.apk' -print || true
              exit 1
            fi
          fi

      - name: Upload standard arm64-v8a unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-arm64-v8a-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-arm64-v8a-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload standard armeabi-v7a unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-armeabi-v7a-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-armeabi-v7a-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload standard universal unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-universal-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload standard x86 unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload standard x86_64 unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-standard-x86_64-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/app-standard-x86_64-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Fongmi universal unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'dual' || env.SELECTED_FLAVOR == 'fongmi' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-fongmi-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/fongmi/release/app-fongmi-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload non-Vulkan universal unsigned APK
        if: ${{ env.SELECTED_FLAVOR == 'all' || env.SELECTED_FLAVOR == 'no_vulkan' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-no-vulkan-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
