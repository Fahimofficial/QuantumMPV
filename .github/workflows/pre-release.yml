name: Make Pre Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
    -Dkotlin.daemon.jvm.options=-Xmx2g

permissions:
  contents: read

jobs:
  release-for-github:
    name: Tagged preview release for GitHub
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch and verify pinned native artifacts
        run: python3 tools/verify_native_artifacts.py --download
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          version_tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Invalid tagged preview version: $version_tag"
            exit 1
          fi
          if [[ "$version_tag" != v1.* ]]; then
            echo "QuantumMPV currently uses the v1.x release line: $version_tag"
            exit 1
          fi
          build_version="$(sed -n 's/^[[:space:]]*versionName = \"\([^\"]*\)\".*/\1/p' app/build.gradle.kts | head -n 1)"
          expected_base="${version_tag#v}"
          expected_base="${expected_base%%-preview.*}"
          if [[ "$build_version" != "$expected_base" ]]; then
            echo "Preview tag $version_tag does not match app versionName $build_version"
            exit 1
          fi
          commit_count="$(git rev-list --count HEAD)"
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"
          echo "EXPECTED_VERSION_NAME=$build_version-beta.r$commit_count" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build preview APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardPreview --stacktrace --no-daemon --max-workers=1
          ./gradlew assembleFongmiPreview --stacktrace --no-daemon --max-workers=1
          ./gradlew assembleNoVulkanPreview --stacktrace --no-daemon --max-workers=1

      - name: Sign and verify preview APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"

          if [[ -z "$SIGNING_KEYSTORE" || -z "$SIGNING_KEY_ALIAS" || -z "$KS_PASS" || -z "$KEY_PASS" ]]; then
            echo "Tagged preview releases require all signing secrets."
            exit 1
          fi
          test -x "$apksigner"

          umask 077
          keystore="$(mktemp "${RUNNER_TEMP:-/tmp}/quantummpv-keystore.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$keystore"

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"
            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected $label APK: $unsigned"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out "$signed" \
              "$unsigned"
            "$apksigner" verify --verbose "$signed"
            package_line=$("$aapt" dump badging "$signed" | sed -n '1p')
            grep -q "package: name='com.quantummpv.app'" <<< "$package_line" || {
              echo "Unexpected application ID in $label: $package_line"
              exit 1
            }
            version_code=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")
            [[ "$version_code" =~ ^[0-9]+$ ]] || {
              echo "Missing or invalid versionCode in $label: $package_line"
              exit 1
            }
            version_name=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")
            [[ "$version_name" == "$EXPECTED_VERSION_NAME" ]] || {
              echo "Unexpected versionName in $label: expected $EXPECTED_VERSION_NAME, got $version_name"
              exit 1
            }
            rm -f "$unsigned"
          }

          preview_dir="app/build/outputs/apk/standard/preview"
          test -d "$preview_dir"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            sign_apk \
              "$preview_dir/app-standard-${abi}-preview-unsigned.apk" \
              "$preview_dir/app-standard-${abi}-preview.apk" \
              "standard $abi preview"
          done

          flavor_dir="app/build/outputs/apk/fongmi/preview"
          test -d "$flavor_dir"
          sign_apk \
            "$flavor_dir/app-fongmi-universal-preview-unsigned.apk" \
            "$flavor_dir/app-fongmi-universal-preview.apk" \
            "fongmi universal preview"

          flavor_dir="app/build/outputs/apk/noVulkan/preview"
          test -d "$flavor_dir"
          sign_apk \
            "$flavor_dir/app-noVulkan-universal-preview-unsigned.apk" \
            "$flavor_dir/app-noVulkan-universal-preview.apk" \
            "non-Vulkan universal preview"

      - name: Verify final APK native contents
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            python3 tools/verify_native_artifacts.py --apk "$apk"
          done < <(find app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned.apk' -print0)
      - name: Stage pre-release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          preview_dir="app/build/outputs/apk/standard/preview"
          mkdir -p preview
          : > checksums.txt
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)

          for abi in "${architectures[@]}"; do
            src="$preview_dir/app-standard-${abi}-preview.apk"
            dst="preview/QuantumMPV-preview-${abi}-${VERSION_TAG}.apk"
            test -f "$src"
            cp "$src" "$dst"
            sha256sum "$dst" | tee -a checksums.txt
          done

          src="app/build/outputs/apk/fongmi/preview/app-fongmi-universal-preview.apk"
          dst="preview/QuantumMPV-preview-fongmi-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

          src="app/build/outputs/apk/noVulkan/preview/app-noVulkan-universal-preview.apk"
          dst="preview/QuantumMPV-preview-no-vulkan-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

      - name: Prepare pre-release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          section = []
          in_latest = False
          for line in changelog:
              if line.startswith('## '):
                  if in_latest:
                      break
                  in_latest = True
              if in_latest:
                  section.append(line)

          latest = '\n'.join(section).strip()
          if not latest:
              raise SystemExit('Could not find latest changelog section')
          Path('pre-release-notes.md').write_text(latest + '\n\n---\n### SHA-256 checksums\n\n```text\n', encoding='utf-8')
          PY
          cat checksums.txt >> pre-release-notes.md
          printf '%s\n' '```' >> pre-release-notes.md

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: QuantumMPV ${{ env.VERSION_TAG }}
          body_path: pre-release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            preview/QuantumMPV-preview-universal-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-arm64-v8a-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-x86-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-x86_64-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-fongmi-${{ env.VERSION_TAG }}.apk
            preview/QuantumMPV-preview-no-vulkan-${{ env.VERSION_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
