name: Secret scan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# The scanner only needs to read the checked-out repository.
permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect leaked secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Pinned to the immutable v3 tag commit. The action runs the scanner locally
      # on the GitHub-hosted runner; no source is sent to Gitleaks for analysis.
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
