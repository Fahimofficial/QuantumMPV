name: Android CI

# Pull request validation and main-branch validation share this workflow, so
# the expensive Gradle build runs once per commit. The job name below is a
# required status check in master branch protection; do not rename it without
# updating the protection rule (see docs/CI_CD.md).

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled. Master runs are never cancelled, so every
  # merged commit gets a result (release workflows require it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
    -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  validate:
    name: Lint, test, and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify pinned native artifacts
        run: python3 tools/verify_native_artifacts.py --download

      - name: Check native artifact and subtitle font regressions
        run: python3 tools/test_native_artifacts.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Validate QuantumMPV identity and protected behavior
        run: python3 tools/validate_quantummpv_identity.py

      - name: Check QuantumMPV-only feature preservation
        run: python3 tools/test_quantummpv_custom_features.py

      - name: Check selected upstream 2.7.x release ports
        run: python3 tools/test_upstream_release_ports.py

      - name: Run debug lint, unit tests, and debug build
        id: debug-validation
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintStandardDebug :app:testStandardDebugUnitTest :app:assembleStandardDebugAndroidTest assembleDebug --stacktrace --no-daemon --max-workers=1
          status=$?
          echo "Gradle validation exited with status $status"
          exit "$status"

      # Runs whenever Gradle ran, including after a Gradle failure, but not when
      # an earlier step failed and no APKs could exist (avoids a misleading
      # "No such file or directory" error hiding the real failure).
      - name: Verify final APK native contents
        if: ${{ !cancelled() && steps.debug-validation.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if [[ ! -d app/build/outputs/apk ]]; then
            echo "::warning::No APK outputs exist because the Gradle build failed; see the previous step."
            exit 0
          fi
          while IFS= read -r -d '' apk; do
            python3 tools/verify_native_artifacts.py --apk "$apk"
          done < <(find app/build/outputs/apk -type f -name '*.apk' ! -path '*/androidTest/*' -print0)
      - name: Upload debug lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantummpv-debug-lint-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Run release lint
        run: ./gradlew :app:lintStandardRelease --stacktrace --no-daemon --max-workers=1

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quantummpv-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
