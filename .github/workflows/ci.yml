name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  validate:
    name: Lint, test, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run debug lint, unit tests, and debug build
        id: debug-validation
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintStandardDebug :app:testStandardDebugUnitTest :app:assembleStandardDebugAndroidTest assembleDebug --stacktrace --no-daemon --max-workers=1
          status=$?
          echo "Gradle validation exited with status $status"
          exit "$status"

      - name: Upload debug lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: quantummpv-debug-lint-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Run release lint
        run: ./gradlew :app:lintStandardRelease --stacktrace --no-daemon --max-workers=1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: quantummpv-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
