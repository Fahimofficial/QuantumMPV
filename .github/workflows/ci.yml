name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
    -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  validate:
    name: Lint, test, and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch and verify pinned native artifacts
        run: python3 tools/verify_native_artifacts.py --download

      - name: Check native artifact and subtitle font regressions
        run: python3 tools/test_native_artifacts.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android build toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.3.13750724"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate QuantumMPV identity and protected behavior
        run: python3 tools/validate_quantummpv_identity.py

      - name: Check QuantumMPV-only feature preservation
        run: python3 tools/test_quantummpv_custom_features.py

      - name: Check selected upstream 2.7.x release ports
        run: python3 tools/test_upstream_release_ports.py

      - name: Run debug lint, unit tests, and debug build
        id: debug-validation
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintStandardDebug :app:testStandardDebugUnitTest :app:assembleStandardDebugAndroidTest assembleDebug --stacktrace --no-daemon --max-workers=1
          status=$?
          echo "Gradle validation exited with status $status"
          exit "$status"

      - name: Verify final APK native contents
        if: ${{ always() }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' apk; do
            python3 tools/verify_native_artifacts.py --apk "$apk"
          done < <(find app/build/outputs/apk -type f -name '*.apk' ! -path '*/androidTest/*' -print0)
      - name: Upload debug lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quantummpv-debug-lint-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Run release lint
        run: ./gradlew :app:lintStandardRelease --stacktrace --no-daemon --max-workers=1

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quantummpv-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
