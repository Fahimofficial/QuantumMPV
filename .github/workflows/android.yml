name: QuantumMPV Android

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_flavor:
        description: Release APK flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - all
          - dual
          - fongmi
          - no_vulkan
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: quantummpv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SELECTED_FLAVOR: ${{ inputs.build_flavor || 'standard' }}
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dkotlin.daemon.jvm.options=-Xmx4g

jobs:
  validate:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Lint, unit tests, and debug build
        run: ./gradlew :app:lintStandardDebug :app:testStandardDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --max-workers=1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quantummpv-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release-build:
    name: Build release APKs
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.3.13750724"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_FLAVOR" in
            standard|dual|all)
              ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=1
              ;;
          esac
          case "$SELECTED_FLAVOR" in
            fongmi|dual|all)
              ./gradlew assembleFongmiRelease --stacktrace --no-daemon --max-workers=1
              ;;
          esac
          case "$SELECTED_FLAVOR" in
            no_vulkan|all)
              ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=1
              ;;
          esac

      - name: Sign APKs when signing secrets are available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.SIGNING_KEYSTORE }}" ]]; then
            echo "Signing secrets are unavailable; retaining unsigned CI APKs."
            exit 0
          fi
          if [[ -z "${{ secrets.SIGNING_KEY_ALIAS }}" || -z "${{ secrets.SIGNING_STORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "Signing keystore exists but required signing secrets are incomplete."
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          test -x "$apksigner"

          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected APK: $unsigned"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" "$unsigned"
            "$apksigner" verify --verbose "$signed"
            rm -f "$unsigned"
          }

          if [[ "$SELECTED_FLAVOR" == "standard" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "all" ]]; then
            dir="app/build/outputs/apk/standard/release"
            for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
              sign_apk "$dir/app-standard-${abi}-release-unsigned.apk" "$dir/app-standard-${abi}-release.apk"
            done
          fi

          if [[ "$SELECTED_FLAVOR" == "fongmi" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "all" ]]; then
            dir="app/build/outputs/apk/fongmi/release"
            sign_apk "$dir/app-fongmi-universal-release-unsigned.apk" "$dir/app-fongmi-universal-release.apk"
          fi

          if [[ "$SELECTED_FLAVOR" == "no_vulkan" || "$SELECTED_FLAVOR" == "all" ]]; then
            dir="app/build/outputs/apk/noVulkan/release"
            sign_apk "$dir/app-noVulkan-universal-release-unsigned.apk" "$dir/app-noVulkan-universal-release.apk"
          fi

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          if [[ "$SELECTED_FLAVOR" == "standard" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "all" ]]; then
            dir="app/build/outputs/apk/standard/release"
            for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
              compgen -G "$dir/app-standard-${abi}-release*.apk" >/dev/null || { echo "Missing standard $abi APK"; exit 1; }
              found=1
            done
          fi
          if [[ "$SELECTED_FLAVOR" == "fongmi" || "$SELECTED_FLAVOR" == "dual" || "$SELECTED_FLAVOR" == "all" ]]; then
            compgen -G "app/build/outputs/apk/fongmi/release/app-fongmi-universal-release*.apk" >/dev/null || { echo "Missing Fongmi APK"; exit 1; }
            found=1
          fi
          if [[ "$SELECTED_FLAVOR" == "no_vulkan" || "$SELECTED_FLAVOR" == "all" ]]; then
            compgen -G "app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release*.apk" >/dev/null || { echo "Missing non-Vulkan APK"; exit 1; }
            found=1
          fi
          test "$found" -eq 1

      - name: Upload release APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: quantummpv-release-${{ env.SELECTED_FLAVOR }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish GitHub release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [validate, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: quantummpv-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/**/*.apk release-assets/*.apk)
          test "${#assets[@]}" -gt 0
          gh release upload "${{ github.event.release.tag_name }}" "${assets[@]}" --clobber
